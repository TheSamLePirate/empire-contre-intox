<?xml version="1.0" encoding="utf-8"?>
<svg aria-labelledby="v17-title v17-desc" fill="#e8eef6" font-family="Arial, Helvetica, sans-serif" role="img" viewBox="0 0 900 210" xmlns="http://www.w3.org/2000/svg"><title id="v17-title">Schéma 6 — Ce que Gurnett n’écoute pas / ce qu’il écoute</title><desc id="v17-desc">Voyager mesure des champs électriques associés à des ondes de plasma avec des antennes, pas la pression d’air avec un microphone. La bande audio du signal permet sa conversion en son de haut-parleur.</desc><style>text{font-family:Arial,Helvetica,sans-serif} @keyframes waveShift{to{stroke-dashoffset:-240}} @keyframes pulseEnv{0%,100%{opacity:.35}50%{opacity:1}} @keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(-80px)}} .anim-wave{stroke-dasharray:8 10;animation:waveShift 2.4s linear infinite}.anim-env{animation:pulseEnv 1.6s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.anim-wave,.anim-env{animation:none}}</style>
<rect fill="#0a1220" height="210" width="900"/>
<text fill="#d4b36a" font-family="Source Sans 3,sans-serif" font-size="16" x="20" y="26">Schéma 6 — Ce que Gurnett n’écoute pas / ce qu’il écoute</text>
<rect fill="#152033" height="120" rx="10" stroke="#e08a6a" width="380" x="40" y="55"/>
<text fill="#e08a6a" font-size="14" x="60" y="85">Pas un micro</text>
<text fill="#9aa8bc" font-size="13" x="60" y="115">pas d’onde de pression 20 Hz–20 kHz</text>
<text fill="#9aa8bc" font-size="13" x="60" y="140">gaz trop raréfié pour un microphone usuel</text>
<rect fill="#152033" height="120" rx="10" stroke="#6fd4c7" width="380" x="480" y="55"/>
<text fill="#6fd4c7" font-size="14" x="500" y="85">Une antenne à plasma</text>
<text fill="#9aa8bc" font-size="13" x="500" y="115">ondes d’électrons déjà en audio</text>
<text fill="#9aa8bc" font-size="13" x="500" y="140">haut-parleur = oscilloscope d’oreille</text>
</svg>
