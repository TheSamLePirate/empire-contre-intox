<?xml version="1.0" encoding="utf-8"?>
<svg aria-labelledby="v07-title v07-desc" fill="#e8eef6" font-family="Arial, Helvetica, sans-serif" role="img" viewBox="0 0 900 210" xmlns="http://www.w3.org/2000/svg"><title id="v07-title">Schéma 4 — De la pression au percept</title><desc id="v07-desc">Le trajet est une simplification pédagogique : les filtres cochléaires et le traitement neural contribuent ensemble au percept ; aucune flèche ne signifie une transformation indépendante du niveau ou du contexte.</desc><style>text{font-family:Arial,Helvetica,sans-serif} @keyframes waveShift{to{stroke-dashoffset:-240}} @keyframes pulseEnv{0%,100%{opacity:.35}50%{opacity:1}} @keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(-80px)}} .anim-wave{stroke-dasharray:8 10;animation:waveShift 2.4s linear infinite}.anim-env{animation:pulseEnv 1.6s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.anim-wave,.anim-env{animation:none}}</style>
<rect fill="#0a1220" height="210" width="900"/>
<text fill="#d4b36a" font-family="Source Sans 3,sans-serif" font-size="16" x="20" y="26">Schéma 4 — De la pression au percept</text>
<rect fill="#152033" height="56" rx="8" stroke="#6fd4c7" width="150" x="30" y="60"/>
<text fill="#e8eef6" font-size="13" x="55" y="93">pression p(t)</text>
<text fill="#d4b36a" font-size="18" x="190" y="93">→</text>
<rect fill="#152033" height="56" rx="8" stroke="#6fd4c7" width="150" x="220" y="60"/>
<text fill="#e8eef6" font-size="13" x="248" y="93">cochlée</text>
<text fill="#d4b36a" font-size="18" x="380" y="93">→</text>
<rect fill="#152033" height="56" rx="8" stroke="#6fd4c7" width="170" x="410" y="60"/>
<text fill="#e8eef6" font-size="13" x="430" y="93">bandes critiques</text>
<text fill="#d4b36a" font-size="18" x="590" y="93">→</text>
<rect fill="#152033" height="56" rx="8" stroke="#d4b36a" width="250" x="620" y="60"/>
<text fill="#f0d9a0" font-size="13" x="648" y="93">hauteur · sonie · timbre</text>
<text fill="#9aa8bc" font-size="13" x="30" y="160"><tspan dy="0" x="30">Fletcher–Munson : la sonie dépend de la fréquence. Helmholtz : rugosité entre partiels voisins.</tspan><tspan dy="16" x="30">Terhardt / Parncutt : modèles de fondamentale virtuelle ; la consonance ne se réduit pas à la rugosité.</tspan></text>
</svg>
