<?xml version="1.0" encoding="utf-8"?>
<svg aria-labelledby="v14-title v14-desc" fill="#e8eef6" font-family="Arial, Helvetica, sans-serif" role="img" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg"><title id="v14-title">Schéma — réverbération</title><desc id="v14-desc">T60 est le temps d’une décroissance de niveau de 60 dB. Il dépend de la bande de fréquence ; la loi de Sabine suppose un champ suffisamment diffus et une absorption modérée.</desc><style>text{font-family:Arial,Helvetica,sans-serif} @keyframes waveShift{to{stroke-dashoffset:-240}} @keyframes pulseEnv{0%,100%{opacity:.35}50%{opacity:1}} @keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(-80px)}} .anim-wave{stroke-dasharray:8 10;animation:waveShift 2.4s linear infinite}.anim-env{animation:pulseEnv 1.6s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.anim-wave,.anim-env{animation:none}}</style>
<rect fill="#0a1220" height="230" width="900"/>
<text fill="#d4b36a" font-family="Source Sans 3,sans-serif" font-size="15" x="20" y="24">Schéma — réverbération</text>
<path d="M100 65 L760 175" fill="none" stroke="#6fd4c7" stroke-width="2"/>
<text fill="#9aa8bc" font-size="12" x="40" y="217">Décroissance idéale après arrêt de la source : −60 dB en T60. Mesurer séparément les bandes de fréquence.</text>
<line stroke="#9aa8bc" x1="100" x2="100" y1="45" y2="185"/><line stroke="#9aa8bc" x1="100" x2="820" y1="185" y2="185"/><path d="M100 175 H760 V185" fill="none" stroke="#d4b36a" stroke-dasharray="4 4"/><text fill="#9aa8bc" font-size="12" x="53" y="69">0 dB</text><text fill="#9aa8bc" font-size="12" x="40" y="179">−60 dB</text><text fill="#9aa8bc" font-size="12" x="745" y="201">T60</text><text fill="#9aa8bc" font-size="12" x="825" y="188">temps</text><text fill="#9aa8bc" font-size="12" x="115" y="53">Niveau relatif (dB)</text></svg>
