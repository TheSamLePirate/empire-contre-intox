<?xml version="1.0" encoding="utf-8"?>
<svg aria-label="Spectre acoustique" aria-labelledby="v02-title v02-desc" fill="#e8eef6" font-family="Arial, Helvetica, sans-serif" role="img" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg"><title id="v02-title">Schéma 2 — Spectre : infra · audible · ultra</title><desc id="v02-desc">Les frontières sont des repères pour une jeune oreille humaine, pas des murs biologiques. Les bandes très élevées relèvent d’autres transducteurs et de conditions de propagation spécifiques.</desc><style>text{font-family:Arial,Helvetica,sans-serif} @keyframes waveShift{to{stroke-dashoffset:-240}} @keyframes pulseEnv{0%,100%{opacity:.35}50%{opacity:1}} @keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(-80px)}} .anim-wave{stroke-dasharray:8 10;animation:waveShift 2.4s linear infinite}.anim-env{animation:pulseEnv 1.6s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.anim-wave,.anim-env{animation:none}}</style>
<rect fill="#0a1220" height="200" width="900"/>
<text fill="#d4b36a" font-family="Source Sans 3,sans-serif" font-size="16" x="20" y="28">Schéma 2 — Spectre : infra · audible · ultra</text>
<rect fill="#3a2a22" height="44" stroke="#e08a6a" width="160" x="40" y="70"/>
<rect fill="#14332f" height="44" stroke="#6fd4c7" width="420" x="200" y="70"/>
<rect fill="#2a3348" height="44" stroke="#d4b36a" width="240" x="620" y="70"/>
<text fill="#e08a6a" font-size="14" x="70" y="98">infrasons</text>
<text fill="#6fd4c7" font-size="14" x="360" y="98">audible humain</text>
<text fill="#d4b36a" font-size="14" x="690" y="98">ultrasons</text>
<text fill="#9aa8bc" font-size="12" x="40" y="140">0,01 Hz</text>
<text fill="#9aa8bc" font-size="12" x="190" y="140">20 Hz</text>
<text fill="#9aa8bc" font-size="12" x="600" y="140">20 kHz</text>
<text fill="#9aa8bc" font-size="12" x="790" y="140">MHz–GHz</text>
<text fill="#9aa8bc" font-size="12" x="40" y="175">séisme · éléphant</text>
<text fill="#9aa8bc" font-size="11" x="260" y="175">téléphone ~300–3400 Hz · sensibilité max ~2–5 kHz</text>
<text fill="#9aa8bc" font-size="12" x="650" y="175">chauve-souris · sonar · écho</text>
