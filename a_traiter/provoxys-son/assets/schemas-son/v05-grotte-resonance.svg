<?xml version="1.0" encoding="utf-8"?>
<svg aria-labelledby="v05-title v05-desc" fill="#e8eef6" font-family="Arial, Helvetica, sans-serif" role="img" viewBox="0 0 900 140" xmlns="http://www.w3.org/2000/svg"><title id="v05-title">Schéma — grotte comme instrument</title><desc id="v05-desc">Schéma d’une hypothèse archéoacoustique, sans reconstitution certaine d’un rite. Une association spatiale ne prouve pas l’intention des peintres ni une règle valable pour toutes les grottes.</desc><style>text{font-family:Arial,Helvetica,sans-serif} @keyframes waveShift{to{stroke-dashoffset:-240}} @keyframes pulseEnv{0%,100%{opacity:.35}50%{opacity:1}} @keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(-80px)}} .anim-wave{stroke-dasharray:8 10;animation:waveShift 2.4s linear infinite}.anim-env{animation:pulseEnv 1.6s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.anim-wave,.anim-env{animation:none}}</style>
<rect fill="#0a1220" height="140" width="900"/>
<text fill="#d4b36a" font-family="Source Sans 3,sans-serif" font-size="15" x="20" y="28">Schéma — grotte comme instrument</text>
<ellipse cx="280" cy="80" fill="none" rx="210" ry="40" stroke="#6fd4c7" stroke-dasharray="6 6"/>
<text fill="#9aa8bc" font-size="13" x="160" y="85">galerie sourde</text>
<ellipse cx="620" cy="80" fill="none" rx="160" ry="46" stroke="#f0d9a0"/>
<text fill="#f0d9a0" font-size="13" x="520" y="75">paroi peinte + résonance</text>
<text fill="#9aa8bc" font-size="12" x="520" y="96">Archéoacoustique : tester les associations décor / résonance</text>
</svg>
