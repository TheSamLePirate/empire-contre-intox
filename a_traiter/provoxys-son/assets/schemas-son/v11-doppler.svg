<?xml version="1.0" encoding="utf-8"?>
<svg aria-labelledby="v11-title v11-desc" fill="#e8eef6" font-family="Arial, Helvetica, sans-serif" role="img" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg"><title id="v11-title">Schéma — source en mouvement : λ se comprime vers l’avant</title><desc id="v11-desc">Chaque cercle part de l’ancienne position de la source. Comparer les espacements devant et derrière ; le déplacement de l’observateur modifie le nombre de fronts reçus sans modifier ces espacements.</desc><style>text{font-family:Arial,Helvetica,sans-serif} @keyframes waveShift{to{stroke-dashoffset:-240}} @keyframes pulseEnv{0%,100%{opacity:.35}50%{opacity:1}} @keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(-80px)}} .anim-wave{stroke-dasharray:8 10;animation:waveShift 2.4s linear infinite}.anim-env{animation:pulseEnv 1.6s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.anim-wave,.anim-env{animation:none}}</style>
<rect fill="#0a1220" height="240" width="900"/>
<text fill="#d4b36a" font-family="Source Sans 3,sans-serif" font-size="16" x="20" y="26">Schéma — source en mouvement : λ se comprime vers l’avant</text>
<circle cx="430" cy="130" fill="#f0d9a0" r="8"/>
<ellipse cx="410" cy="130" fill="none" opacity=".9" rx="30" ry="30" stroke="#6fd4c7"/>
<ellipse cx="390" cy="130" fill="none" opacity=".7" rx="60" ry="60" stroke="#6fd4c7"/>
<ellipse cx="370" cy="130" fill="none" opacity=".45" rx="90" ry="90" stroke="#6fd4c7"/>
<path d="M438 130 L530 130" stroke="#d4b36a" stroke-width="2"/>
<text fill="#d4b36a" font-size="12" x="480" y="120">vs</text>
<text fill="#9aa8bc" font-size="12" x="140" y="130">λ plus grande</text>
<text fill="#9aa8bc" font-size="12" x="560" y="80">λ plus petite → f plus haute</text>
<text fill="#9aa8bc" font-size="12" x="30" y="233">Fronts émis à intervalles égaux ; centres aux anciennes positions. Source vers la droite, milieu immobile.</text>
<polygon fill="#d4b36a" points="530,130 520,125 520,135"/></svg>
