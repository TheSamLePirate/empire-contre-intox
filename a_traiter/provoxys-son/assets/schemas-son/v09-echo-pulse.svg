<?xml version="1.0" encoding="utf-8"?>
<svg aria-labelledby="v09-title v09-desc" fill="#e8eef6" font-family="Arial, Helvetica, sans-serif" role="img" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg"><title id="v09-title">Schéma 5 — Écho pulsé (Langevin → sonar → échographe)</title><desc id="v09-desc">Δt est le temps total aller-retour ; un trajet vaut Δt/2 si la cible et le milieu sont immobiles. La profondeur est cΔt/2.</desc><style>text{font-family:Arial,Helvetica,sans-serif} @keyframes waveShift{to{stroke-dashoffset:-240}} @keyframes pulseEnv{0%,100%{opacity:.35}50%{opacity:1}} @keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(-80px)}} .anim-wave{stroke-dasharray:8 10;animation:waveShift 2.4s linear infinite}.anim-env{animation:pulseEnv 1.6s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.anim-wave,.anim-env{animation:none}}</style>
