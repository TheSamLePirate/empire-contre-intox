server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  server_tokens off;
  sendfile on;
  tcp_nopush on;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/rss+xml
    image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /rss.xml {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location ~* \.(?:html|xml|json)$ {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location ~* \.(?:css|js|mjs|png|jpe?g|gif|webp|svg|ico|mp4|webm|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
