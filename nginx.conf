# Ce fichier est inclus dans le bloc `http` (conf.d/*.conf) : `map` et
# `limit_req_zone` sont donc valides ici, hors du bloc `server`.

# IP du client réelle : première entrée de X-Forwarded-For, sinon l'IP du
# pair. Sert uniquement de clé de quota (en-tête déclaratif, falsifiable).
map $http_x_forwarded_for $eci_client_ip {
  default          $remote_addr;
  "~^(?P<xff>[^,]+)" $xff;
}

# Première ligne de défense devant le compteur : le service Bun applique
# ensuite son propre quota par client + global.
limit_req_zone  $eci_client_ip zone=eci_api:10m rate=120r/m;
limit_conn_zone $eci_client_ip zone=eci_api_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# Cache navigateur des ressources statiques. Seules les URL qui portent une
# empreinte de contenu `?v=<hash>` (posée par scripts/stamp-assets.py, ou par
# un build) sont immuables : une ressource modifiée change d'URL et se
# recharge d'elle-même. Sans empreinte, scripts et styles sont revalidés à
# chaque visite (ETag → 304, quasi gratuit) ; images, médias et polices
# gardent un jour de cache. Personne n'a plus à vider son cache après une
# mise à jour d'atelier.
map $args $eci_cache_code {
  default                        "no-cache";
  "~(^|&)v=[0-9A-Za-z._-]{4,}"   "public, max-age=31536000, immutable";
}
map $args $eci_cache_media {
  default                        "public, max-age=86400, stale-while-revalidate=604800";
  "~(^|&)v=[0-9A-Za-z._-]{4,}"   "public, max-age=31536000, immutable";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  server_tokens off;
  sendfile on;
  tcp_nopush on;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/rss+xml
    image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    limit_req  zone=eci_api burst=60 nodelay;
    limit_conn eci_api_conn 16;

    # Le compteur n'expose que /count, /visit et /health.
    limit_except GET POST OPTIONS { deny all; }

    proxy_pass http://counter:3001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
    client_max_body_size 16k;
  }

  location = /rss.xml {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location ~* \.(?:html|xml|json)$ {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location ~* \.(?:css|js|mjs)$ {
    add_header Cache-Control $eci_cache_code always;
    try_files $uri =404;
  }

  location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|mp4|webm|woff2?)$ {
    add_header Cache-Control $eci_cache_media always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
